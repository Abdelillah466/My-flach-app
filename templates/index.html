<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل النصوص</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 { text-align: center; color: #333; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .results {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
        .results p { margin: 8px 0; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>محلل النصوص والكلمات</h2>
    
    <form action="/analyze" method="POST">
        <textarea name="text" placeholder="اكتب أي نص هنا...">{{ original_text }}</textarea>
        <button type="submit">تحليل النص</button>
    </form>

    {% if result %}
    <div class="results">
        <h3>نتائج التحليل:</h3>
        <p>عدد الكلمات: <strong>{{ result.words }}</strong></p>
        <p>عدد الحروف والرموز: <strong>{{ result.chars }}</strong></p>
    </div>
    {% endif %}
</div>

</body>
</html>
