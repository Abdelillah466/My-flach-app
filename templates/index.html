<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقعي الأول</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; }
        textarea { width: 90%; height: 80px; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { background-color: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .result { margin-top: 1rem; padding: 10px; background: #065f46; color: #34d399; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>مُحلل النصوص المباشر</h1>
        <form action="/analyze" method="POST">
            <textarea name="text_data" placeholder="اكتب أي نص هنا..."></textarea><br>
            <button type="submit">حساب الحروف والكلمات</button>
        </form>
        <!-- RESULT -->
    </div>
</body>
</html>
